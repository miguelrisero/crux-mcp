[project]
name = "crux-mcp"
version = "0.1.0"
description = "MCP server for the Chrome UX Report — real-user Core Web Vitals for any origin or URL"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Miguel Risero" }]
keywords = ["mcp", "crux", "core-web-vitals", "chrome-ux-report", "seo", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = ["mcp>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
crux-mcp = "crux_mcp.server:main"

[project.urls]
Homepage = "https://github.com/miguelrisero/crux-mcp"
Issues = "https://github.com/miguelrisero/crux-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crux_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

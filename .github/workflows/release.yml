name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify the tag matches the packaged version
        # A tag that disagrees with pyproject.toml publishes a version nobody expects.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Test before publishing
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow via OIDC.
      # No API token is stored in the repo or in any secret.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC proves this workflow belongs to the io.github.miguelrisero namespace,
      # so the registry needs no stored credential either.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          VERSION=$(curl -s https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | grep -oP '"tag_name": "\Kv[0-9.]+')
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Wait for PyPI to serve the new version
        # The registry verifies the declared package exists. PyPI's CDN can lag the
        # upload by a minute, and a publish that runs too early fails on a real package.
        run: |
          VERSION=$(python -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 20); do
            if curl -sf "https://pypi.org/pypi/crux-mcp/${VERSION}/json" > /dev/null; then
              echo "crux-mcp ${VERSION} is live on PyPI"; exit 0
            fi
            echo "waiting for PyPI... ($i)"; sleep 15
          done
          echo "PyPI did not serve ${VERSION} in time"; exit 1

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

